<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>중여커 관리자</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/img/logo.png">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>

<!-- 로그인 -->
<div class="login-wrap" id="loginWrap" style="display:none">
  <form class="login-card" id="loginForm">
    <img src="assets/img/logo.png" alt="중여커" onerror="this.style.display='none'">
    <h1>중여커 관리자</h1>
    <p>benefits.zhongyouke.com</p>
    <div class="f"><label>이메일</label><input type="email" id="loginEmail" autocomplete="username" required></div>
    <div class="f"><label>비밀번호</label><input type="password" id="loginPw" autocomplete="current-password" required></div>
    <button type="submit" class="primary">로그인</button>
    <div class="login-msg" id="loginMsg"></div>
    <div class="login-hint">
      관리자 계정은 Supabase 대시보드 → <b>Authentication → Users → Add user</b> 에서 이메일/비밀번호로 생성하세요.
    </div>
  </form>
</div>

<!-- 관리자 -->
<div class="admin" id="adminWrap" style="display:none">
  <aside class="side" id="side">
    <div class="side-head">
      <img src="assets/img/logo.png" alt="" onerror="this.style.display='none'">
      <div><b>중여커 관리자</b><span>benefits.zhongyouke.com</span></div>
    </div>
    <nav class="side-nav" id="sideNav"></nav>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="btn sm side-toggle" id="sideToggle">☰</button>
      <h2 id="pageH">대시보드</h2>
      <a class="btn sm" href="index.html" target="_blank">사이트 보기 ↗</a>
      <span class="who" id="whoAmI"></span>
      <button class="btn sm" id="logoutBtn">로그아웃</button>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- 편집 모달 -->
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-head"><h3 id="modalTitle">편집</h3><button class="btn sm" id="modalX" aria-label="닫기">닫기</button></div>
    <div class="modal-body"><form id="modalForm"><div class="form-grid" id="modalFields"></div></form></div>
    <div class="modal-foot">
      <button class="btn" id="modalCancel">취소</button>
      <button class="btn primary" id="modalSave">저장</button>
    </div>
  </div>
</div>

<div class="a-toast" id="aToast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/db.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/admin-schema.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
