<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제휴업체 - 중여커</title>
<meta name="description" content="지역·업종별 중여커 제휴업체를 검색해 보세요.">
<link rel="icon" href="assets/img/logo.png">
<link rel="stylesheet" href="assets/css/style.css?v=6">
</head>
<body data-page-title="제휴업체">

<div data-ad-slot="top_strip"></div>
<header class="site-header" id="siteHeader"></header>

<main>
  <section class="page-head">
    <div class="container">
      <p class="bc" id="bc"></p>
      <h2 id="pageTitle">전체 제휴업체</h2>
    </div>
  </section>

  <section class="filter-bar">
    <div class="container">
      <div class="filter-row">
        <span class="fl">업종</span>
        <div class="tabs" id="catFilter" style="margin:0"></div>
      </div>
      <div class="filter-row sub hide" id="subCatRow">
        <span class="fl"></span>
        <div class="tabs" id="subCatFilter" style="margin:0"></div>
      </div>
      <div class="filter-row">
        <span class="fl">지역</span>
        <div class="tabs" id="regFilter" style="margin:0"></div>
      </div>
      <div class="filter-row sub hide" id="subRegRow">
        <span class="fl"></span>
        <div class="tabs" id="subRegFilter" style="margin:0"></div>
      </div>
    </div>
  </section>

  <section class="container">
    <div id="setupAlert"></div>
    <div class="result-bar">
      <div>총 <b id="cnt">0</b>곳</div>
      <select class="sort-sel" id="sortSel">
        <option value="sort">기본 정렬</option>
        <option value="new">최신 등록순</option>
        <option value="name">이름순</option>
        <option value="view">인기순</option>
      </select>
    </div>
    <div class="card-grid" id="grid"></div>
    <div class="ad-wrap" style="margin:28px 0"><div data-ad-slot="list_inline"></div></div>
  </section>
</main>

<footer class="site-footer" id="siteFooter"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/db.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/common.js?v=6"></script>
<script src="assets/js/cards.js"></script>
<script src="assets/js/list.js"></script>
</body>
</html>
